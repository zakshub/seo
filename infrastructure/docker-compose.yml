services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: venture_os
      POSTGRES_USER: venture
      POSTGRES_PASSWORD: venture
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on: [postgres]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: venture
      POSTGRES_PWD: venture
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
volumes:
  postgres-data:
